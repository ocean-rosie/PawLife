function healthTrendChart(){const d=healthTrendSeries();const w=540,h=170;const labels=d.labels.map((x,i)=>{const px=16+i*((w-32)/(d.labels.length-1));return `<text x="${px}" y="165" text-anchor="middle" font-size="10" fill="#8A847B">${x}</text>`}).join('');return `<section class="card trend-chart"><div class="trend-chart-head"><div><div class="section-title" style="margin-bottom:2px">健康趋势总览</div><div class="subtle">相对个人基线指数 · 100 = Mimi 平时状态</div></div><span class="tag sage">${state.healthRange==='today'?'今日':state.healthRange==='7d'?'近7天':state.healthRange==='30d'?'近30天':'长期'}</span></div><svg viewBox="0 0 540 176" role="img" aria-label="健康趋势折线图"><g stroke="#E8E0D5" stroke-width="1">${[80,100,120].map(v=>{const y=16+(120-v)*((170-32)/(120-70));return `<line x1="16" x2="524" y1="${y}" y2="${y}" ${v===100?'stroke-dasharray="5 5" stroke="#A49D92"':''}/><text x="2" y="${y+3}" font-size="9" fill="#9A948A">${v}</text>`}).join('')}</g><polyline fill="none" stroke="#75876F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${linePoints(d.activity)}"/><polyline fill="none" stroke="#C97B5F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${linePoints(d.jump)}"/><polyline fill="none" stroke="#D79C54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${linePoints(d.sleep)}"/>${labels}</svg><div class="chart-legend"><span><i class="legend-dot sage"></i>活动能力</span><span><i class="legend-dot clay"></i>跳跃能力</span><span><i class="legend-dot amber"></i>睡眠时长</span></div><div class="chart-note">虚线 100 代表 Mimi 自己的个人基线；该图用于展示趋势，不代表疾病概率。</div></section>`}
function baselineBars(){const vals=state.healthRange==='today'?[['活动量',93,'-7%'],['跳跃',92,'-8%'],['睡眠',106,'+6%'],['呼吸',99,'稳定']]:state.healthRange==='7d'?[['活动量',92,'-8%'],['跳跃',89,'-11%'],['睡眠',106,'+6%'],['呼吸',100,'稳定']]:state.healthRange==='30d'?[['活动量',81,'-19%'],['跳跃',76,'-24%'],['睡眠',115,'+15%'],['起身',84,'异常12天']]:[['活动范围',88,'-12%'],['跳跃频率',82,'-18%'],['睡眠',110,'+10%'],['体重',96,'4.9→4.7kg']];return `<section class="card card-pad"><div class="section-title">与个人基线比较</div><p class="subtle">中心刻度代表 100 = Mimi 的常态；条形越偏离，越值得结合其他证据关注。</p><div class="baseline-rows">${vals.map((x,i)=>{const width=Math.min(100,Math.max(8,x[1]/130*100));const cls=x[1]<90?'warn':x[1]>108?'up':'';return `<div class="baseline-row"><span>${x[0]}</span><div class="baseline-track"><div class="baseline-fill ${cls}" style="width:${width}%"></div></div><b>${x[2]}</b></div>`}).join('')}</div></section>`}

function memoryTimeline(){const items={"2016":[['第一次回家','🏠','躲在沙发下面两个小时，晚上才出来。'],['第一次体检','🩺','建立早期健康记录。']],"2018":[['最喜欢的窗边','☀️','每天午后最常停留的地方。'],['第一次旅行','🧳','第一次和家人一起短途出行。']],"2020":[['声音档案','🎧','饭前短叫和呼噜声逐渐形成个体模式。']],"2022":[['第一视角回忆','📷','从 Mimi 的视角看这个家。']],"2024":[['健康变化','♡','活动与睡眠开始进入中老年长期比较。']],"2026":[['年度健康回顾','▤','整合健康、声音、第一视角和家庭互动。'],['中老年阶段','🐾','重点关注运动、心肺、疼痛与认知变化。']]};const arr=items[state.memoryYear]||items['2026'];return `<section class="card memory-cover"><h2>Mimi 的生命时间轴</h2><p>健康、声音、第一视角、常去地点、与你的互动，逐渐成为一份真实而温暖的长期记录。</p></section><div class="year-line" style="margin-top:15px">${['2016','2018','2020','2022','2024','2026'].map(x=>`<button class="year-chip ${state.memoryYear===x?'active':''}" onclick="state.memoryYear='${x}';render()">${x}</button>`).join('')}</div><div class="grid memory-grid">${arr.map(x=>`<button class="card memory-card clickable" style="text-align:left" onclick="toast('打开：${x[0]}')"><div class="photo">${x[1]}</div><h4>${x[0]}</h4><p>${x[2]}</p></button>`).join('')}</div>`}
function memoryMuseum(){return `<section class="card card-pad"><span class="tag sage">数字生命纪念馆</span><h2>自动整理一生素材</h2><p class="muted">把分散在健康档案、宠物视角、主人相册和声音模型中的真实记录重新组织成完整生命叙事。</p><div class="grid g3" style="margin-top:14px">${[['一生照片','🖼'],['第一视角视频','📷'],['主人拍摄视频','🎬'],['声音档案','🎧'],['成长记录','🌱'],['行为习惯','🐾'],['重要日期','📅'],['健康历程','♡'],['家庭故事','⌂']].map(x=>`<button class="card card-pad clickable" onclick="toast('打开 ${x[0]}（演示）')"><div style="font-size:28px">${x[1]}</div><b>${x[0]}</b></button>`).join('')}</div></section>`}

function render(){const oldNav=document.querySelector('.nav');const navScroll=oldNav?oldNav.scrollTop:0;let html='';if(state.view==='home')html=home();else if(state.view==='health')html=health();else if(state.view==='pawview')html=pawview();else if(state.view==='safety')html=safety();else if(state.view==='my')html=my();else if(state.view==='vet')html=vet();else if(state.view==='care')html=careCenter();else if(state.view==='records')html=recordsScreen();else if(state.view==='device')html=device();else if(state.view==='memory')html=memory();else if(state.view==='shop')html=shop();else if(state.view==='homehub')html=homehub();else if(state.view==='profile')html=profile();$('#root').innerHTML=html;const newNav=document.querySelector('.nav');if(newNav)newNav.scrollTop=navScroll;}
