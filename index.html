.pet-tabs{display:flex;gap:9px}.pet-tab{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:9px 12px;display:flex;align-items:center;gap:8px}.pet-tab.active{border-color:var(--sage);background:var(--sage-soft)}.hub-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hub-box{padding:16px;text-align:center}.hub-box .big{font-size:30px}.hub-box b{font-size:13px;display:block;margin-top:8px}.hub-box p{font-size:11px;color:var(--muted);margin:3px 0}
.profile-head{display:flex;align-items:center;gap:15px}.owner-avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#E7EEDB,#F7DCD2);font-size:29px}.settings-list{display:grid;gap:8px}.setting{display:flex;align-items:center;gap:10px;padding:13px 14px;border:1px solid var(--line);background:var(--paper);border-radius:15px}.setting .ico{width:34px;height:34px;border-radius:11px;background:var(--sage-soft);display:grid;place-items:center}.setting b{font-size:13px}.setting span{font-size:11px;color:var(--muted);display:block}.setting .arr{margin-left:auto;color:var(--muted)}
.drawer-bg,.modal-bg{position:fixed;inset:0;background:rgba(35,37,32,.28);z-index:80;display:flex;align-items:stretch;justify-content:flex-end;animation:fade .18s ease}.drawer{width:min(520px,100%);background:var(--bg);box-shadow:-18px 0 50px rgba(30,30,25,.18);padding:24px;overflow:auto;animation:slide .22s ease}.modal-bg{align-items:center;justify-content:center;padding:18px}.modal{width:min(680px,100%);max-height:88vh;overflow:auto;background:var(--bg);border-radius:24px;box-shadow:0 28px 80px rgba(30,30,25,.24);padding:23px;animation:pop .2s ease}.close{float:right;border:0;background:var(--paper);width:36px;height:36px;border-radius:12px;font-size:18px}.modal h2,.drawer h2{margin:3px 0 5px}.notice{padding:12px 14px;border-radius:14px;background:var(--amber-soft);color:#815b2b;font-size:12px}.toast{position:fixed;right:22px;bottom:24px;z-index:120;background:#2E3C31;color:#fff;padding:11px 15px;border-radius:14px;box-shadow:var(--shadow);animation:toast .25s ease;font-size:13px}.input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:13px;padding:10px 12px;outline:none}.input:focus{border-color:var(--sage)}.form-grid{display:grid;gap:11px}.label{font-size:12px;font-weight:700;margin-bottom:5px;display:block}
.mobile-nav{display:none}.mobile-top{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes slide{from{transform:translateX(30px);opacity:.7}to{transform:none;opacity:1}}@keyframes pop{from{transform:scale(.97);opacity:.7}to{transform:none;opacity:1}}@keyframes toast{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:1050px){.health-viz-grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.g4,.action-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.menu-grid,.shop-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.memory-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hub-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){:root{--topbar:62px}.sidebar,.topbar{display:none}.main{margin-left:0;padding-top:62px;padding-bottom:76px}.mobile-top{display:flex;position:fixed;inset:0 0 auto;height:62px;background:rgba(247,242,233,.94);backdrop-filter:blur(13px);z-index:35;border-bottom:1px solid var(--line);align-items:center;padding:0 16px}.mobile-top .brand{padding:0;font-size:17px}.mobile-top .brand-mark{width:32px;height:32px}.mobile-top .mini-pet{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700}.mobile-top .pet-avatar{width:34px;height:34px;font-size:20px}.mobile-nav{display:grid;position:fixed;inset:auto 0 0;height:68px;background:rgba(255,253,249,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:50;grid-template-columns:repeat(5,1fr);padding-bottom:max(4px,env(safe-area-inset-bottom))}.mnav{border:0;background:transparent;display:grid;place-items:center;gap:1px;font-size:10px;color:var(--muted);padding:7px 2px}.mnav .ico{font-size:20px;line-height:1}.mnav.active{color:var(--sage-deep);font-weight:800}.screen{padding:20px 15px 36px}.screen-head{margin-bottom:16px}.screen-head h1{font-size:23px}.g2,.g3,.device-top,.realtime-box,.vet-summary{grid-template-columns:1fr}.metrics,.risk-grid{grid-template-columns:1fr 1fr}.menu-grid,.shop-grid,.memory-grid,.hub-grid{grid-template-columns:1fr 1fr}.map{height:330px}.video-frame{min-height:210px}.drawer{padding:20px 15px}.record{grid-template-columns:76px 34px 1fr}.record>.tag{display:none}}
@media(max-width:520px){.donut-wrap{grid-template-columns:1fr}.donut{margin:auto}.baseline-row{grid-template-columns:72px 1fr 48px}.risk-bar-row{grid-template-columns:96px 1fr 46px}.metrics,.risk-grid,.menu-grid,.shop-grid,.memory-grid,.hub-grid,.g4,.action-grid{grid-template-columns:1fr}.health-hero{padding:18px}.health-hero h3{font-size:19px}.hero-pet .pet-avatar{width:55px;height:55px}.screen-head .right{display:none}.map{height:290px}.video-frame{min-height:190px}.vet-actions{grid-template-columns:1fr 1fr}.device-visual{height:230px}.collar-ring{width:165px;height:165px}.top-compact{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const pets={
 mimi:{name:'Mimi',emoji:'🐱',breed:'布偶猫',age:'10岁',sex:'母 · 已绝育',weight:'4.7 kg',status:'需要轻度关注',conclusion:'过去 7 天运动能力较个人基线略有下降，暂未发现急性高风险信号。'},
 coco:{name:'Coco',emoji:'🐶',breed:'柯基',age:'7岁',sex:'公 · 已绝育',weight:'12.3 kg',status:'整体稳定',conclusion:'今日活动、睡眠和静息呼吸均接近个人基线，暂未发现持续异常趋势。'}
};
const state={view:'home',sub:'',pet:'mimi',healthRange:'30d',healthTab:'summary',pawTab:'live',safeTab:'map',recordFilter:'全部',power:'daily',memoryYear:'2026',memoryTab:'timeline',shopCat:'推荐',reportPeriod:'week',missing:false,history:[]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const p=()=>pets[state.pet];
const fmtDate=()=>new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(new Date());
function icon(name){const m={home:'⌂',health:'♥',paw:'◉',safe:'⌖',me:'●'};return m[name]||'•'}
function logoMark(){return `<span class="brand-mark" aria-label="PawLife 标志"><svg viewBox="0 0 32 32" aria-hidden="true">
<g class="paw-fill" transform="translate(2 8)"><ellipse cx="4.2" cy="5.2" rx="2.1" ry="2.8" transform="rotate(-22 4.2 5.2)"/><ellipse cx="8.6" cy="2.8" rx="2.1" ry="2.8" transform="rotate(-7 8.6 2.8)"/><ellipse cx="13.2" cy="3.1" rx="2.1" ry="2.8" transform="rotate(8 13.2 3.1)"/><ellipse cx="17" cy="5.9" rx="2.1" ry="2.7" transform="rotate(22 17 5.9)"/><path d="M5.7 13.3c0-4 2.7-7 6.1-7 3.5 0 6.5 3 6.5 6.8 0 2.8-1.9 4.5-4.2 3.8-.9-.3-1.5-.8-2.3-.8-.8 0-1.4.5-2.4.8-2.1.6-3.7-.9-3.7-3.6Z"/></g>
<g class="paw-fill" transform="translate(18 1) scale(.58)"><ellipse cx="4.2" cy="5.2" rx="2.1" ry="2.8" transform="rotate(-22 4.2 5.2)"/><ellipse cx="8.6" cy="2.8" rx="2.1" ry="2.8" transform="rotate(-7 8.6 2.8)"/><ellipse cx="13.2" cy="3.1" rx="2.1" ry="2.8" transform="rotate(8 13.2 3.1)"/><ellipse cx="17" cy="5.9" rx="2.1" ry="2.7" transform="rotate(22 17 5.9)"/><path d="M5.7 13.3c0-4 2.7-7 6.1-7 3.5 0 6.5 3 6.5 6.8 0 2.8-1.9 4.5-4.2 3.8-.9-.3-1.5-.8-2.3-.8-.8 0-1.4.5-2.4.8-2.1.6-3.7-.9-3.7-3.6Z"/></g></svg></span>`}

function healthTabTo(tab){state.history.push({view:state.view,sub:state.sub,healthTab:state.healthTab});state.view='health';state.sub='';state.healthTab=tab;render()}
function sideActive(view,tab=''){return view==='health'&&tab?state.view==='health'&&state.healthTab===tab:state.view===view}
function navTo(view,sub=''){state.history.push({view:state.view,sub:state.sub});state.view=view;state.sub=sub;window.scrollTo(0,0);render()}
function back(){const last=state.history.pop();if(last){state.view=last.view;state.sub=last.sub}else{state.view='my';state.sub=''};window.scrollTo(0,0);render()}
function toast(msg){const x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function openDrawer(html){document.body.insertAdjacentHTML('beforeend',`<div class="drawer-bg" id="overlay" onclick="if(event.target.id==='overlay')closeOverlay()"><aside class="drawer"><button class="close" onclick="closeOverlay()">×</button>${html}</aside></div>`)}
function openModal(html){document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="overlay" onclick="if(event.target.id==='overlay')closeOverlay()"><section class="modal"><button class="close" onclick="closeOverlay()">×</button>${html}</section></div>`)}
function closeOverlay(){$('#overlay')?.remove()}
function categoryActive(cat){
 if(cat==='home')return state.view==='home';
 if(cat==='health')return state.view==='health'||state.view==='records';
 if(cat==='medical')return ['vet','care'].includes(state.view);
 if(cat==='device')return ['pawview','safety','device'].includes(state.view);
 if(cat==='family')return state.view==='homehub';
 if(cat==='shop')return state.view==='shop';
 if(cat==='memory')return state.view==='memory';
 if(cat==='account')return ['my','profile'].includes(state.view);
 return false;
}
function shell(content,title){
 const pet=p();
 const groups=[
  ['日常',[
    ['home','home','⌂','首页']
  ]],
  ['健康',[
    ['health','health','♥','健康管理']
  ]],
  ['医疗',[
    ['medical','vet','✚','医疗服务']
  ]],
  ['设备',[
    ['device','pawview','◉','设备与安全']
  ]],
  ['严选',[
    ['shop','shop','▣','健康严选']
  ]],
  ['记忆',[
    ['memory','memory','♡','数字生命']
  ]],
  ['账户',[
    ['account','my','●','我的']
  ]]
 ];
 const navHtml=groups.map(g=>`<div class="nav-group"><div class="nav-group-title">${g[0]}</div>${g[1].map(x=>`<button class="nav-btn ${categoryActive(x[0])?'active':''}" onclick="navTo('${x[1]}')"><span class="nav-ico">${x[2]}</span>${x[3]}</button>`).join('')}</div>`).join('');
 return `<div class="app">
 <aside class="sidebar"><div class="brand">${logoMark()}PawLife</div>
 <button class="pet-switch" onclick="openPetSwitcher()"><span class="pet-avatar">${pet.emoji}</span><span class="pet-meta"><b>${pet.name}</b><span>${pet.breed} · ${pet.age}</span></span><span class="chev">⌄</span></button>
 <nav class="nav">${navHtml}</nav></aside>
 <header class="topbar"><span class="top-title">${title}</span><div class="top-actions"><span class="status-pill"><i class="dot"></i>项圈在线 · 日常健康模式</span><button class="icon-btn" onclick="navTo('my','notifications')">🔔</button><button class="icon-btn" onclick="navTo('my','settings')">⚙</button></div></header>
 <header class="mobile-top"><div class="brand">${logoMark()}PawLife</div><button class="mini-pet" onclick="openPetSwitcher()"><span>${pet.name}</span><span class="pet-avatar">${pet.emoji}</span></button></header>
 <main class="main"><div class="screen">${content}</div></main>
 <nav class="mobile-nav">${[['home','首页'],['health','健康'],['pawview','宠物视角'],['safety','安全'],['my','我的']].map(([v,n])=>`<button class="mnav ${state.view===v?'active':''}" onclick="navTo('${v}')"><span class="ico">${icon(v==='pawview'?'paw':v==='safety'?'safe':v==='my'?'me':v)}</span><span>${n}</span></button>`).join('')}</nav></div>`
}
function header(title,desc='',right=''){const nested=!['home','health','pawview','safety','my'].includes(state.view)||!!state.sub;return `<div class="screen-head">${nested?`<div><button class="back-btn" onclick="back()">← 返回</button><h1>${title}</h1>${desc?`<p>${desc}</p>`:''}</div>`:`<div><h1>${title}</h1>${desc?`<p>${desc}</p>`:''}</div>`}<div class="right">${right}</div></div>`}
function home(){const pet=p();return shell(`${header(`你好，林一 👋`,`今天一起看看 ${pet.name} 的状态。`)}
<div class="grid g2">
 <section class="card card-pad"><div class="hero-pet"><span class="pet-avatar">${pet.emoji}</span><div><h2>${pet.name}</h2><p>${pet.breed} · ${pet.age} · ${pet.weight} · ${pet.sex}</p><div class="quick-status"><span class="tag green">● 项圈在线</span><span class="tag sage">日常健康模式</span><span class="tag">电量 72%</span></div></div></div></section>
 <section class="card card-pad"><div class="section-title">📅 ${fmtDate()}</div><div class="risk-line"><span class="risk-dot ${state.pet==='mimi'?'amber':'green'}"></span><div><b>${pet.status}</b><div class="subtle">智能 健康分析已更新 · 2分钟前</div></div></div></section>
</div>
<section class="card health-hero clickable" style="margin-top:16px" onclick="navTo('health')"><span class="tag ${state.pet==='mimi'?'amber':'green'}">今日整体状态</span><h3>${pet.status}</h3><p>${pet.conclusion}</p><div class="hero-actions"><button class="btn" onclick="event.stopPropagation();navTo('health')">查看完整分析</button><button class="btn secondary" onclick="event.stopPropagation();navTo('vet','consult')">咨询兽医</button></div></section>
<h3 class="section-title" style="margin-top:24px">今日概览 <span class="subtle">点击查看详情</span></h3>
<div class="grid metrics">${metricCards()}</div>
<div class="grid g2" style="margin-top:16px"><section class="card card-pad"><div class="section-title">实时状态</div><div class="realtime-box"><div><div class="current-state"><span class="tag green">● 实时</span><h3 style="margin:12px 0 4px">当前：正在窗边休息</h3><p class="subtle">最近更新 1 分钟前 · 客厅窗边 · 室内</p><div class="divider"></div><div class="grid g2" style="gap:8px"><div><span class="subtle">当前活动</span><b style="display:block">静息 / 趴卧</b></div><div><span class="subtle">异常状态</span><b style="display:block;color:var(--green)">未发现急性异常</b></div></div></div><button class="btn secondary" style="margin-top:10px;width:100%" onclick="healthTabTo('behavior')">查看实时行为</button></div><div class="window-scene"></div></div></section>
<section class="card card-pad"><div class="section-title">今日事件时间轴</div>${timelineHome()}</section></div>
<div class="grid g4" style="margin-top:16px"><div class="card card-pad clickable" onclick="navTo('health')"><b>🩺 给结果，不只给数据</b><p class="subtle">风险方向、证据、趋势和下一步行动。</p></div><div class="card card-pad clickable" onclick="navTo('device','hardware')"><b>⭕ 分布式柔性硬件</b><p class="subtle">降低局部负重和下坠感。</p></div><div class="card card-pad clickable" onclick="navTo('pawview')"><b>📷 事件触发视觉</b><p class="subtle">异常发生时才让 摄像头 去看。</p></div><div class="card card-pad clickable" onclick="navTo('vet','feedback')"><b>🔁 临床反馈闭环</b><p class="subtle">真实就医结果反哺个体风险模型。</p></div></div>`,'首页')}
function metricCards(){const m=[['活动量','63%','较基线 -8%','🏃','activity'],['睡眠','15.8 h','较基线 +6%','🌙','sleep'],['跳跃','18 次','较基线 -24%','↗','jump'],['进食','4 次','规律稳定','🍽','eat'],['饮水行为','6 次','接近基线','💧','drink'],['静息心率','趋势稳定','今日无持续异常','♥','heart'],['静息呼吸','趋势稳定','静息时接近基线','〰','breath'],['体表温度','趋势稳定','今日无明显偏移','◒','temp']];return m.map(x=>`<button class="card metric clickable" onclick="showMetric('${x[4]}')" style="text-align:left"><div class="metric-top"><span class="metric-ico">${x[3]}</span><b>${x[0]}</b></div><strong>${x[1]}</strong><small>${x[2]}</small><div class="trend">查看趋势 →</div></button>`).join('')}
function timelineHome(){const e=[['08:10','早餐','进食持续 9 分钟'],['10:42','跳上猫爬架','动作完成，较平时稍慢'],['13:20','进入深睡','连续睡眠 1 小时 26 分钟'],['16:05','抓挠右耳 6 次','高于近 30 日同时间段'],['16:05','宠物视角 自动唤醒','保存 20 秒事件片段'],['16:06','智能 分析完成','轻度耳部异常行为，建议继续观察']];return `<div class="timeline">${e.map(x=>`<div class="timeline-item"><div class="time">${x[0]}</div><div class="rail"><i></i></div><div class="ev"><b>${x[1]}</b><span class="subtle">${x[2]}</span></div></div>`).join('')}</div>`}
function showMetric(type){const d={activity:['活动量','过去7天活动水平较个人基线下降 8%。下降主要集中在傍晚活动时段，目前属于轻度变化。','活动时长','较个人基线 -8%'],sleep:['睡眠','过去7天平均睡眠时长增加约 6%，夜间连续睡眠结构基本稳定。','平均睡眠','15.8 h'],jump:['跳跃','过去30天跳跃次数下降 24%，且跳跃前犹豫时间增加，是当前运动系统分析的重要证据。','日均跳跃','18 次'],eat:['进食','进食次数和时间规律稳定，未发现持续性进食减少。','今日进食','4 次'],drink:['饮水行为','今日饮水行为频率接近个人基线。项圈识别的是饮水行为，不直接测量饮水毫升数。','今日饮水行为','6 次'],heart:['静息心率趋势','静息心率趋势未出现持续性偏离。运动后升高可由活动状态解释。','当前趋势','稳定'],breath:['静息呼吸趋势','静息状态下呼吸趋势接近个人基线，未出现持续上移。','当前趋势','稳定'],temp:['体表温度趋势','体表温度趋势未出现持续性明显偏移。体表温度不能直接替代核心体温。','当前趋势','稳定']};const x=d[type];openDrawer(`<h2>${x[0]}</h2><p class="muted">与 Mimi 自己的个人基线比较</p><div class="card card-pad" style="margin-top:14px"><span class="subtle">${x[2]}</span><h3 style="margin:4px 0">${x[3]}</h3><div class="bar"><i style="width:${type==='jump'?'58%':'72%'}"></i></div></div><div class="card card-pad" style="margin-top:12px"><b>专业解读</b><p>${x[1]}</p><div class="notice">该结果用于健康趋势与风险预警，不替代兽医检查。</div></div><button class="btn" style="margin-top:12px" onclick="closeOverlay();navTo('health')">进入完整健康分析</button>`)}
function medicalTabs(active='consult'){const tabs=[['consult','在线问诊'],['brief','兽医摘要'],['hospitals','医院搜索'],['feedback','临床闭环'],['care','日常管理']];return `<div class="tabs category-tabs">${tabs.map(([k,n])=>`<button class="tab ${active===k?'active':''}" onclick="${k==='care'?`navTo('care')`:k==='consult'?`navTo('vet')`:`navTo('vet','${k}')`}">${n}</button>`).join('')}</div>`}
function deviceTabs(active='pawview'){const tabs=[['pawview','宠物视角'],['safety','定位与安全'],['device','设备与续航'],['hardware','硬件结构']];return `<div class="tabs category-tabs">${tabs.map(([k,n])=>`<button class="tab ${active===k?'active':''}" onclick="${k==='hardware'?`navTo('device','hardware')`:`navTo('${k}')`}">${n}</button>`).join('')}</div>`}

function health(){
 if(state.sub && ['behavior','sound','records','reports'].includes(state.sub)){state.healthTab=state.sub;state.sub=''}
 const tabs=[['summary','专业分析'],['risk','风险预警'],['behavior','实时行为'],['sound','声音理解'],['records','健康档案'],['reports','健康报告']];
 let body='';
 if(state.healthTab==='risk') body=riskPanel();
 else if(state.healthTab==='behavior') body=healthBehaviorPanel();
 else if(state.healthTab==='sound') body=healthSoundPanel();
 else if(state.healthTab==='records') body=healthRecordsPanel();
 else if(state.healthTab==='reports') body=healthReportsPanel();
 else body=healthSummary();
 return shell(`${header('健康','同一健康中心内切换分析、风险、行为、声音、档案与报告，不离开当前页面。')}<div class="tabs">${tabs.map(([k,n])=>`<button class="tab ${state.healthTab===k?'active':''}" onclick="state.healthTab='${k}';state.sub='';render()">${n}</button>`).join('')}</div><div class="health-subpanel">${body}</div>`,'健康')
}

function linePoints(vals,w=540,h=170){const min=70,max=120,pad=16;return vals.map((v,i)=>{const x=pad+i*((w-pad*2)/(vals.length-1));const y=pad+(max-v)*((h-pad*2)/(max-min));return `${x.toFixed(1)},${y.toFixed(1)}`}).join(' ')}
function healthTrendChart(){const d=healthTrendSeries();const w=540,h=170;const labels=d.labels.map((x,i)=>{const px=16+i*((w-32)/(d.labels.length-1));return `<text x="${px}" y="165" text-anchor="middle" font-size="10" fill="#8A847B">${x}</text>`}).join('');return `<section class="card trend-chart"><div class="trend-chart-head"><div><div class="section-title" style="margin-bottom:2px">健康趋势总览</div><div class="subtle">相对个人基线指数 · 100 = Mimi 平时状态</div></div><span class="tag sage">${state.healthRange==='today'?'今日':state.healthRange==='7d'?'近7天':state.healthRange==='30d'?'近30天':'长期'}</span></div><svg viewBox="0 0 540 176" role="img" aria-label="健康趋势折线图"><g stroke="#E8E0D5" stroke-width="1">${[80,100,120].map(v=>{const y=16+(120-v)*((170-32)/(120-70));return `<line x1="16" x2="524" y1="${y}" y2="${y}" ${v===100?'stroke-dasharray="5 5" stroke="#A49D92"':''}/><text x="2" y="${y+3}" font-size="9" fill="#9A948A">${v}</text>`}).join('')}</g><polyline fill="none" stroke="#75876F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${linePoints(d.activity)}"/><polyline fill="none" stroke="#C97B5F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${linePoints(d.jump)}"/><polyline fill="none" stroke="#D79C54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${linePoints(d.sleep)}"/>${labels}</svg><div class="chart-legend"><span><i class="legend-dot sage"></i>活动能力</span><span><i class="legend-dot clay"></i>跳跃能力</span><span><i class="legend-dot amber"></i>睡眠时长</span></div><div class="chart-note">虚线 100 代表 Mimi 自己的个人基线；该图用于展示趋势，不代表疾病概率。</div></section>`}
function baselineBars(){const vals=state.healthRange==='today'?[['活动量',93,'-7%'],['跳跃',92,'-8%'],['睡眠',106,'+6%'],['呼吸',99,'稳定']]:state.healthRange==='7d'?[['活动量',92,'-8%'],['跳跃',89,'-11%'],['睡眠',106,'+6%'],['呼吸',100,'稳定']]:state.healthRange==='30d'?[['活动量',81,'-19%'],['跳跃',76,'-24%'],['睡眠',115,'+15%'],['起身',84,'异常12天']]:[['活动范围',88,'-12%'],['跳跃频率',82,'-18%'],['睡眠',110,'+10%'],['体重',96,'4.9→4.7kg']];return `<section class="card card-pad"><div class="section-title">与个人基线比较</div><p class="subtle">中心刻度代表 100 = Mimi 的常态；条形越偏离，越值得结合其他证据关注。</p><div class="baseline-rows">${vals.map((x,i)=>{const width=Math.min(100,Math.max(8,x[1]/130*100));const cls=x[1]<90?'warn':x[1]>108?'up':'';return `<div class="baseline-row"><span>${x[0]}</span><div class="baseline-track"><div class="baseline-fill ${cls}" style="width:${width}%"></div></div><b>${x[2]}</b></div>`}).join('')}</div></section>`}

function healthSummary(){const ranges=[['today','今日'],['7d','近7天'],['30d','近30天'],['long','长期趋势']];const d=healthRangeData();return `<div class="tabs">${ranges.map(([k,n])=>`<button class="tab ${state.healthRange===k?'active':''}" onclick="state.healthRange='${k}';render()">${n}</button>`).join('')}</div><div class="grid g2"><section class="card analysis-card"><span class="tag ${d.tagClass}">${d.tag}</span><h3>${d.title}</h3><p class="muted">${d.desc}</p><div class="divider"></div><div class="grid g2"><div><span class="subtle">趋势</span><b style="display:block;color:${state.healthRange==='30d'?'var(--red)':'var(--ink)'}">${d.trend}</b></div><div><span class="subtle">比较基准</span><b style="display:block">Mimi 的个人基线</b></div></div><button class="btn secondary" style="margin-top:14px" onclick="toggleWhy()">为什么得出这个判断 ▾</button><div id="whybox" style="display:none"><div class="evidence">${d.evidence.map(x=>`<div class="evi"><span>•</span><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><p class="subtle">系统结合活动、睡眠、行为、年龄、同期生命体征与 Mimi 自己的历史基线进行联合判断，而不是根据单一指标报警。</p></div></section><section class="card analysis-card"><div class="section-title">下一步应该做什么</div><div class="action-list">${d.actions.map((x,i)=>`<div class="action"><span class="num">${i+1}</span><span>${x}</span></div>`).join('')}</div><div class="btn-row" style="margin-top:17px"><button class="btn" onclick="navTo('vet','consult')">在线咨询兽医</button><button class="btn secondary" onclick="navTo('vet','brief')">生成 兽医摘要</button></div></section></div><div class="health-viz-grid">${healthTrendChart()}<div class="grid" style="gap:16px">${baselineBars()}${activityDonut()}</div></div><div class="grid g2" style="margin-top:16px">${riskBars()}<section class="card card-pad"><div class="section-title">本周期关键证据</div><div class="evidence">${d.evidence.map((x,i)=>`<div class="evi"><span>${['①','②','③','④'][i]}</span><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><button class="btn secondary" onclic function render(){const oldNav=document.querySelector('.nav');const navScroll=oldNav?oldNav.scrollTop:0;let html='';if(state.view==='home')html=home();else if(state.view==='health')html=health();else if(state.view==='pawview')html=pawview();else if(state.view==='safety')html=safety();else if(state.view==='my')html=my();else if(state.view==='vet')html=vet();else if(state.view==='care')html=careCenter();else if(state.view==='records')html=recordsScreen();else if(state.view==='device')html=device();else if(state.view==='memory')html=memory();else if(state.view==='shop')html=shop();else if(state.view==='homehub')html=homehub();else if(state.view==='profile')html=profile();$('#root').innerHTML=html;const newNav=document.querySelector('.nav');if(newNav)newNav.scrollTop=navScroll;}
render();
</script>
